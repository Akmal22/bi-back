spring.applicatsion.name=bi-back

server.port=8080

server.servlet.context-path=/bi
server.servlet.session.cookie.name=BI_SESSION_ID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=true
spring.session.store-type=jdbc

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=

spring.liquibase.change-log=db/migration/changelog-master.xml
spring.liquibase.enabled=true

spring.messages.basename=messages
spring.messages.encoding=UTF-8

spring.jpa.open-in-view=false
app.frontend.origin=http://localhost:3000

